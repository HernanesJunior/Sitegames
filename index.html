<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="VoiceHub - Comunicador acessível com síntese de voz para pessoas mudas">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VoiceHub">
    <meta name="apple-mobile-web-app-icons" content="192x192">
    <meta name="msapplication-TileColor" content="#4F46E5">
    <meta name="msapplication-TileImage" content="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 144 144'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%234F46E5'/><stop offset='100%' style='stop-color:%23764ba2'/></linearGradient></defs><rect width='144' height='144' fill='url(%23g)'/><text x='50%' y='50%' font-size='90' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>🗣️</text></svg>">
    <title>VoiceHub - Comunicador Acessível</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%234F46E5'/><stop offset='100%' style='stop-color:%23764ba2'/></linearGradient></defs><rect width='64' height='64' fill='url(%23g)' rx='8'/><text x='50%' y='50%' font-size='40' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>🗣️</text></svg>">
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%234F46E5'/><stop offset='100%' style='stop-color:%23764ba2'/></linearGradient></defs><rect width='64' height='64' fill='url(%23g)' rx='8'/><text x='50%' y='50%' font-size='40' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>🗣️</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%234F46E5'/><stop offset='100%' style='stop-color:%23764ba2'/></linearGradient></defs><rect width='180' height='180' fill='url(%23g)' rx='40'/><text x='50%' y='50%' font-size='100' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>🗣️</text></svg>">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <script src="pwa-config.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🗣️ VoiceHub</h1>
            <p>Comunicador acessível para pessoas mudas</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Section: Entrada de Texto -->
            <section class="input-section">
                <h2>Digite ou Selecione</h2>
                <div class="input-group">
                    <textarea 
                        id="textInput" 
                        placeholder="Digite sua mensagem aqui... (máx. 300 caracteres)"
                        maxlength="300"
                        aria-label="Campo de texto para mensagem"
                    ></textarea>
                    <div class="char-counter">
                        <span id="charCount">0</span>/300
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="action-buttons">
                    <button id="speakBtn" class="btn btn-primary" aria-label="Falar mensagem">
                        🔊 Falar
                    </button>
                    <button id="clearBtn" class="btn btn-secondary" aria-label="Limpar texto">
                        🗑️ Limpar
                    </button>
                    <button id="stopBtn" class="btn btn-secondary" aria-label="Parar de falar" style="display:none;">
                        ⏹️ Parar
                    </button>
                </div>

                <!-- Status da Síntese -->
                <div id="status" class="status"></div>
            </section>

            <!-- Section: Frases Pré-definidas -->
            <section class="phrases-section">
                <h2>Frases Rápidas</h2>
                <div class="phrases-grid" id="phrasesGrid"></div>
                <button id="addPhraseBtn" class="btn btn-outline">+ Adicionar Frase</button>
            </section>

            <!-- Section: Sugestões -->
            <section class="suggestions-section" id="suggestionsSection" style="display:none;">
                <h2>Sugestões</h2>
                <div class="suggestions-list" id="suggestionsList"></div>
            </section>

            <!-- Section: Histórico -->
            <section class="history-section">
                <div class="history-header">
                    <h2>Histórico</h2>
                    <button id="toggleHistory" class="btn btn-outline" aria-expanded="false">
                        ▼ Ver Histórico
                    </button>
                </div>
                <div id="historyContainer" class="history-container" style="display:none;">
                    <div id="historyList" class="history-list"></div>
                    <button id="clearHistoryBtn" class="btn btn-danger">🗑️ Limpar Histórico</button>
                </div>
            </section>

            <!-- Section: Compartilhamento -->
            <section class="share-section">
                <h2>Compartilhar</h2>
                <div class="share-buttons">
                    <button id="shareBtn" class="btn btn-outline">📤 Gerar QR Code</button>
                    <button id="copyLinkBtn" class="btn btn-outline">🔗 Copiar Link</button>
                </div>
                <div id="qrContainer" class="qr-container" style="display:none;">
                    <div id="qr"></div>
                    <p>Escaneie para acessar este comunicador</p>
                </div>
            </section>

            <!-- Section: Configurações -->
            <section class="settings-section">
                <h2>⚙️ Configurações</h2>
                <div class="settings-group">
                    <label for="voiceSelect">Voz:</label>
                    <select id="voiceSelect">
                        <option value="">Padrão do Sistema</option>
                    </select>
                </div>
                <div class="settings-group">
                    <label for="speedSlider">Velocidade: <span id="speedValue">1</span>x</label>
                    <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1" aria-label="Velocidade de fala">
                </div>
                <div class="settings-group">
                    <label for="pitchSlider">Tom: <span id="pitchValue">1</span></label>
                    <input type="range" id="pitchSlider" min="0.5" max="2" step="0.1" value="1" aria-label="Tom de voz">
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>VoiceHub © 2026 - Comunicação sem barreiras</p>
        </footer>
    </div>

    <!-- Modal para Adicionar Frase -->
    <div id="phraseModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3>Adicionar Nova Frase</h3>
            <input 
                type="text" 
                id="newPhraseInput" 
                placeholder="Digite a frase (máx. 80 caracteres)"
                maxlength="80"
            >
            <div class="modal-buttons">
                <button id="savePhraseBtn" class="btn btn-primary">Salvar</button>
                <button id="cancelPhraseBtn" class="btn btn-secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
